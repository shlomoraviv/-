<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbyig5wjhHEFUFrJCdakcxu_-R302GplBuxyJo5jintWf7oEXHa_cK4mRvFivHu6AtAjlQ/exec";
const GOOGLE_CLIENT_ID = '426523025549-7c50rkn7cun4vmm2r802u0ij6egjehtg.apps.googleusercontent.com';
const PRINCIPAL_ADMIN_EMAIL = "0556798858b@gmail.com";

let me = null;
let siteData = JSON.parse(localStorage.getItem('site_cache')) || { title: "מזג האוויר", categories: ["כללי"], users: [] };
let posts = JSON.parse(localStorage.getItem('posts_cache')) || [];
let activeCat = siteData.categories[0];
let unreadMap = {};

function initGoogle() {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogle });
  const saved = localStorage.getItem('bina_user');
  if (saved) { me = JSON.parse(saved); applyLogin(); }
  else { google.accounts.id.renderButton(document.getElementById('googleBtn'), { theme: 'outline', size: 'large' }); }
}

async function handleGoogle(resp) {
  const payload = JSON.parse(atob(resp.credential.split('.')[1]));
  me = { email: payload.email, name: payload.name, picture: payload.picture };
  localStorage.setItem('bina_user', JSON.stringify(me));
  applyLogin();
}

function doLogout() { localStorage.removeItem('bina_user'); location.reload(); }

async function applyLogin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('userAvatar').innerHTML = `<img src="${me.picture}" style="width:34px;height:34px;border-radius:50%;border:2px solid #1a56db;">`;
  document.getElementById('userAvatar').onclick = (e) => { e.stopPropagation(); const m = document.getElementById('userMenu'); m.style.display = m.style.display === 'none' ? 'block' : 'none'; };
  document.getElementById('userMenuInfo').innerHTML = `<strong>${me.name}</strong><br><small>${me.email}</small>`;

  // טעינה מהירה מה-Cache
  renderCategories();
  renderFeed();
  checkPermissions();

  // עדכון נתונים מהשרת במקביל
  refreshAllData();
}

async function api(action, params = {}) {
  const p = document.getElementById('prog');
  p.style.transform = 'scaleX(0.4)';
  try {
    const r = await fetch(BACKEND, { method: 'POST', body: JSON.stringify({ action, ...params, user: me.email }) });
    const j = await r.json();
    p.style.transform = 'scaleX(1)';
    setTimeout(() => p.style.transform = 'scaleX(0)', 200);
    return j;
  } catch (e) { p.style.transform = 'scaleX(0)'; return { status: "error" }; }
}

async function refreshAllData() {
  // טעינה מקבילית לשיפור מהירות
  const [dataRes, postsRes] = await Promise.all([
    api("get_site_data"),
    api("get_posts")
  ]);

  if (dataRes.status === "ok") {
    siteData = dataRes.data;
    localStorage.setItem('site_cache', JSON.stringify(siteData));
    document.getElementById('hdrChannelName').innerText = siteData.title;
  }
  if (postsRes.status === "ok") {
    posts = postsRes.posts;
    localStorage.setItem('posts_cache', JSON.stringify(posts));
  }

  renderCategories();
  renderFeed();
  checkPermissions();
}

function getMyRole() {
  if (me.email === PRINCIPAL_ADMIN_EMAIL) return "principal";
  const u = siteData.users.find(u => u.email === me.email);
  return u ? u.role : "viewer";
}

function checkPermissions() {
  const role = getMyRole();
  document.getElementById('adminComposeBar').style.display = (role !== "viewer") ? 'flex' : 'none';
  document.getElementById('adminPanelBtn').style.display = (role === "admin" || role === "principal") ? 'block' : 'none';
  if (role !== "viewer") {
    document.getElementById('composerNameBadge').innerText = role === "principal" ? "ראשי" : (role === "admin" ? "מנהל" : "מעלה");
    setupComposeCats(role);
  }
}

function setupComposeCats(role) {
  const s = document.getElementById('composeCategorySelect');
  let allowed = (role === "uploader") ? (siteData.users.find(u => u.email === me.email)?.allowedCats || []) : siteData.categories;
  s.innerHTML = allowed.map(c => `<option value="${c}">${c}</option>`).join('');
}

function renderCategories() {
  const list = document.getElementById('channelsList');
  list.innerHTML = siteData.categories.map(cat => `
    <div class="channel-item ${activeCat === cat ? 'active' : ''} ${unreadMap[cat] ? 'has-unread' : ''}" onclick="setActiveCat('${cat}')">
      <i class="fas fa-hashtag"></i> ${cat}
      <div class="unread-badge-cat"></div>
    </div>`).join('');
}

function setActiveCat(cat) {
  activeCat = cat;
  unreadMap[cat] = false;
  renderCategories();
  renderFeed();
}

function renderFeed() {
  const inner = document.getElementById('feedInner');
  const filtered = posts.filter(p => p.category === activeCat);
  if (!filtered.length) { document.getElementById('empty').style.display = 'block'; inner.innerHTML = ""; return; }
  document.getElementById('empty').style.display = 'none';

  // יצירת כל ה-HTML בבת אחת לשיפור ביצועים
  inner.innerHTML = filtered.map(p => `
    <div class="msg-row">
      <img class="msg-av" src="https://cdn-icons-png.flaticon.com/128/6476/6476785.png">
      <div class="msg-col">
        <div class="msg-meta"><span class="msg-meta-name">${p.senderName}</span><span class="msg-meta-time">${new Date(p.ts).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span></div>
        <div class="bubble-wrap-outer">
          ${(getMyRole()==='admin'||getMyRole()==='principal') ? `<div class="bubble-top-actions"><button onclick="deletePost('${p.id}')"><i class="fas fa-trash"></i></button></div>` : ''}
          <div class="bubble">
            ${p.text ? `<div class="bubble-text">${p.text}</div>` : ''}
            ${p.img ? `<div class="bubble-img"><img src="${p.img}" loading="lazy" onclick="openLightbox('${p.img}')"></div>` : ''}
            ${p.video ? renderVid(p.video) : ''}
          </div>
        </div>
      </div>
    </div>`).join('');
}

function renderVid(url) {
  if (url.includes('drive.google.com')) {
    let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
    return `<div class="bubble-vid"><iframe src="https://drive.google.com/file/d/${id}/preview"></iframe></div>`;
  }
  return `<div class="bubble-vid"><video src="${url}" controls loading="lazy"></video></div>`;
}

async function sendPost() {
  const ed = document.getElementById('composeEditor');
  const text = ed.innerText.trim();
  const cat = document.getElementById('composeCategorySelect').value;
  if (!text && !window._pendingImg && !window._pendingVid) return;
  const btn = document.getElementById('sendBtn'); btn.disabled = true;
  const res = await api("add_post", { text, category: cat, img: window._pendingImg || "", video: window._pendingVid || "", senderName: me.name });
  if (res.status === "ok") { ed.innerText = ""; window._pendingImg = ""; window._pendingVid = ""; await refreshAllData(); }
  btn.disabled = false;
}

function openVideoPrompt() { const u = prompt("קישור לסרטון (דרייב או ישיר):"); if (u) window._pendingVid = u; }
function triggerImgUpload() { const u = prompt("קישור לתמונה:"); if (u) window._pendingImg = u; }
async function deletePost(id) { if (confirm("למחוק?")) { await api("delete_post", { id }); refreshAllData(); } }
function openMail() { window.location.href = "mailto:0556798858b@gmail.com"; }

function openAdminModal() {
  document.getElementById('adminModal').style.display = 'flex';
  const role = getMyRole();
  if (role === "principal") {
    document.getElementById('principalAdminSection').style.display = 'block';
    document.getElementById('siteTitleInp').value = siteData.title;
    renderUserList();
  }
  if (role === "principal" || role === "admin") {
    document.getElementById('adminSection').style.display = 'block';
    renderCatMgmt();
  }
}

document.getElementById('newUserRole').onchange = (e) => {
  const box = document.getElementById('uploaderPermsBox');
  box.style.display = (e.target.value === 'uploader') ? 'block' : 'none';
  document.getElementById('catPermList').innerHTML = siteData.categories.map(c => `<label><input type="checkbox" value="${c}" class="cat-perm-chk"> ${c}</label>`).join(' ');
};

async function updateSiteSettings() { await api("update_site_title", { title: document.getElementById('siteTitleInp').value }); location.reload(); }
async function addNewUser() {
  const email = document.getElementById('newUserEmail').value;
  const role = document.getElementById('newUserRole').value;
  let allowed = [];
  if (role === 'uploader') document.querySelectorAll('.cat-perm-chk:checked').forEach(c => allowed.push(c.value));
  await api("manage_user", { action: "add", email, role, allowedCats: allowed });
  refreshAllData();
}

function renderUserList() { document.getElementById('userList').innerHTML = siteData.users.map(u => `<div style="font-size:12px;">${u.email} (${u.role}) <button onclick="removeUser('${u.email}')" style="color:red;border:none;background:none;cursor:pointer;">X</button></div>`).join(''); }
async function removeUser(email) { await api("manage_user", { action: "remove", email }); refreshAllData(); }
async function addCategory() { await api("manage_category", { action: "add", name: document.getElementById('newCatInp').value }); refreshAllData(); }
function renderCatMgmt() { document.getElementById('categoryMgmtList').innerHTML = siteData.categories.map(c => `<div>${c} <button onclick="deleteCat('${c}')" style="color:red;border:none;background:none;cursor:pointer;">X</button></div>`).join(''); }
async function deleteCat(name) { if (confirm("למחוק?")) { await api("manage_category", { action: "remove", name }); refreshAllData(); } }

function toggleDark() { document.body.classList.toggle('dark'); localStorage.setItem('shaagat_dark', document.body.classList.contains('dark') ? '1' : '0'); }
function openLightbox(src) { document.getElementById('lbImg').src = src; document.getElementById('lightbox').style.display = 'flex'; }

window.onclick = (e) => { if (!e.target.closest('#userAvatar')) document.getElementById('userMenu').style.display = 'none'; };
window.addEventListener('load', () => { initGoogle(); if (localStorage.getItem('shaagat_dark') === '1') document.body.classList.add('dark'); });
</script>
</body>
</html>
