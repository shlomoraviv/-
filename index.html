<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbyig5wjhHEFUFrJCdakcxu_-R302GplBuxyJo5jintWf7oEXHa_cK4mRvFivHu6AtAjlQ/exec";
const GOOGLE_CLIENT_ID = '426523025549-7c50rkn7cun4vmm2r802u0ij6egjehtg.apps.googleusercontent.com';
const CLOUDINARY_CLOUD_NAME = 'xgh73omp';
const CLOUDINARY_UPLOAD_PRESET = 'website_upload';

// משתני הגדרות אתר דינמיים
let SITE_TITLE = "מזג האוויר";
let SITE_LOGO = "https://cdn-icons-png.flaticon.com/128/6476/6476785.png";
let SITE_LOGIN_SUB = "התחברות באמצעות גוגל";

let me = null, items = [], lastTs = 0, isWriter = false, isAdmin = false;

// פונקציית API משופרת למהירות
async function api(action, params = {}, method = 'GET') {
    const url = new URL(BACKEND);
    url.searchParams.set('action', action);
    if (method === 'GET') Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    
    const options = { method: method === 'POST' ? 'POST' : 'GET' };
    if (method === 'POST') options.body = JSON.stringify(params);
    
    const r = await fetch(url);
    return await r.json();
}

// העלאת מדיה ל-Cloudinary (תמונה או וידאו)
async function handleMediaUpload(el, targetInputId, statusId, type) {
    const file = el.files[0];
    if (!file) return;

    // הגבלת גודל וידאו ל-15MB כדי לשמור על קרדיטים
    if (type === 'video' && file.size > 15 * 1024 * 1024) {
        alert("הסרטון גדול מדי (מעל 15MB). כדי לשמור על מהירות האתר ומכסת האחסון, נא להעלות קבצים קטנים יותר או להשתמש בקישור Drive.");
        el.value = ''; return;
    }

    const status = document.getElementById(statusId);
    status.innerHTML = `<i class="fas fa-spinner fa-spin"></i> מעלה...`;

    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${type}/upload`, { method: 'POST', body: fd });
        const data = await res.json();
        if (data.secure_url) {
            document.getElementById(targetInputId).value = data.secure_url;
            status.innerHTML = `<i class="fas fa-check" style="color:green"></i> הועלה!`;
        }
    } catch (e) {
        status.innerHTML = `<i class="fas fa-times" style="color:red"></i> שגיאה`;
    }
}

// טעינת הגדרות אתר מה-Apps Script
async function loadSiteSettings() {
    const settings = await api('api_settings');
    if (settings.title) SITE_TITLE = settings.title;
    if (settings.logoUrl) SITE_LOGO = settings.logoUrl;
    if (settings.loginText) SITE_LOGIN_SUB = settings.loginText;
    updateUIWithSettings();
}

function updateUIWithSettings() {
    document.getElementById('pageTitle').innerText = SITE_TITLE;
    document.getElementById('loginSiteTitle').innerText = SITE_TITLE;
    document.getElementById('hdrChannelName').innerText = SITE_TITLE;
    document.getElementById('loginSiteSub').innerText = SITE_LOGIN_SUB;
    document.getElementById('loginLogo').src = SITE_LOGO;
    document.getElementById('hdrLogo').src = SITE_LOGO;
    document.getElementById('favicon').href = SITE_LOGO;
}

async function handleGoogle(resp) {
    const payload = JSON.parse(atob(resp.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    const email = payload.email.toLowerCase();
    const d = await api('auth_check', { email });
    if (d.banned) { document.getElementById('loginScreen').style.display='none'; document.getElementById('bannedScreen').style.display='flex'; return; }
    
    me = { email, name: payload.name, picture: payload.picture };
    isAdmin = !!d.admin; isWriter = !!d.writer;
    
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    if (isWriter || isAdmin) document.getElementById('adminComposeBar').style.display = 'flex';
    
    renderUserAvatar();
    loadFeed();
    setInterval(pollFeed, 10000); // Poll כל 10 שניות לחיסכון במשאבים
}

function renderUserAvatar() {
    const av = document.getElementById('userAvatar');
    av.innerHTML = `<img src="${me.picture}" onclick="openAdminPanel()" style="width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid #1a56db;">`;
}

async function loadFeed() {
    const d = await api('feed', { channel: 'general', limit: 20 });
    items = d.messages || [];
    const inner = document.getElementById('feedInner');
    inner.innerHTML = items.map(buildMsg).join('');
    lastTs = items.length ? Math.max(...items.map(m => m.ts)) : 0;
    document.getElementById('empty').style.display = items.length ? 'none' : 'block';
}

async function pollFeed() {
    const d = await api('feed_poll', { channel: 'general', since: lastTs }, 'POST');
    if (d.newMessages && d.newMessages.length) {
        lastTs = Math.max(...d.newMessages.map(m => m.ts));
        const inner = document.getElementById('feedInner');
        d.newMessages.forEach(m => {
            const div = document.createElement('div');
            div.innerHTML = buildMsg(m);
            inner.prepend(div.firstChild);
        });
        document.getElementById('empty').style.display = 'none';
    }
}

function buildMsg(m) {
    let media = "";
    if (m.imgUrl) media += `<div class="bubble-img"><img src="${m.imgUrl}" loading="lazy" onclick="openLightbox('${m.imgUrl}')"></div>`;
    if (m.videoUrl) media += `<div class="bubble-vid"><video controls preload="none" src="${m.videoUrl}"></video></div>`;
    
    return `
    <div class="msg-row" data-id="${m.id}">
      <img class="msg-av" src="${SITE_LOGO}">
      <div class="msg-col">
        <div class="msg-meta"><span class="msg-meta-name">${SITE_TITLE}</span></div>
        <div class="bubble">
          <div class="bubble-text">${m.text || ''}</div>
          ${media}
        </div>
      </div>
    </div>`;
}

function openLightbox(src) { document.getElementById('lbImg').src = src; document.getElementById('lightbox').style.display = 'flex'; }

// פאנל ניהול עם הסעיפים החדשים
function switchAdminSection(sec) {
    const body = document.getElementById('apBody');
    document.getElementById('apTitle').innerText = (sec === 'stats' ? 'סטטיסטיקות' : sec === 'site' ? 'פרטי אתר' : 'חסימות');
    
    if (sec === 'stats') {
        body.innerHTML = `<div style="text-align:center;">טוען נתונים...</div>`;
        api('site_stats').then(d => {
            body.innerHTML = `
            <div class="ap-field" style="text-align:center"><b>מחוברים עכשיו:</b> ${d.online}</div>
            <div class="ap-field" style="text-align:center"><b>שיא כל הזמנים:</b> ${d.peak}</div>
            <div class="ap-field" style="text-align:center"><b>ביקורים ביממה:</b> ${d.day}</div>`;
        });
    } else if (sec === 'site') {
        body.innerHTML = `
        <div class="ap-sec-site-details">
            <label>שם האתר:</label><input id="set_title" class="ap-field" value="${SITE_TITLE}">
            <label>לוגו אתר (כתובת URL):</label><input id="set_logo" class="ap-field" value="${SITE_LOGO}">
            <label>טקסט מסך התחברות:</label><input id="set_loginText" class="ap-field" value="${SITE_LOGIN_SUB}">
            <button onclick="saveSiteSettings()" class="ap-btn" style="background:#1a56db; color:#fff; width:100%; padding:10px;">שמור שינויים</button>
        </div>`;
    } else if (sec === 'blocking') {
        body.innerHTML = `<input id="block_email" class="ap-field" placeholder="אימייל לחסימה"><button onclick="blockUser()" class="ap-btn" style="width:100%">חסום משתמש</button>`;
    }
}

async function saveSiteSettings() {
    const title = document.getElementById('set_title').value;
    const logoUrl = document.getElementById('set_logo').value;
    const loginText = document.getElementById('set_loginText').value;
    
    await api('api_settings', { admin_email: me.email, title, logoUrl, loginText }, 'POST');
    alert("ההגדרות נשמרו ויתעדכנו בטעינה הבאה.");
    location.reload();
}

async function sendFeedPost() {
    const text = document.getElementById('composeEditor').innerText.trim();
    const imgUrl = document.getElementById('composeImgUrl').value;
    const videoUrl = document.getElementById('composeVidUrl').value;
    if (!text && !imgUrl && !videoUrl) return;
    
    const d = await api('feed_add', { senderEmail: me.email, sender: SITE_TITLE, text, imgUrl, videoUrl, channel: 'general' }, 'POST');
    if (d.status === 'ok') {
        document.getElementById('composeEditor').innerText = '';
        document.getElementById('composeImgUrl').value = '';
        document.getElementById('composeVidUrl').value = '';
        loadFeed();
    }
}

function openAdminPanel() { if(isAdmin) document.getElementById('adminPanelModal').classList.add('open'); }
function closeAdminPanel() { document.getElementById('adminPanelModal').classList.remove('open'); }
function toggleCtbDropdown(id) { 
    const el = document.getElementById(id); 
    const isOpen = el.classList.contains('open');
    document.querySelectorAll('.ctb-dropdown').forEach(d => d.classList.remove('open'));
    if(!isOpen) el.classList.add('open');
}
function composeFormat(cmd) { document.execCommand(cmd, false, null); }

// אתחול
window.onload = () => {
    loadSiteSettings(); // טעינת מראה האתר מהשרת
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogle });
    google.accounts.id.renderButton(document.getElementById('googleBtn'), { theme: 'outline', size: 'large' });
};
</script>
