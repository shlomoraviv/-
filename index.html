<script>
/* 
   -------------------------------------------------------
   הגדרות API מקוריות - אל תשנה שום Action
   -------------------------------------------------------
*/
const BACKEND = "https://script.google.com/macros/s/AKfycbyig5wjhHEFUFrJCdakcxu_-R302GplBuxyJo5jintWf7oEXHa_cK4mRvFivHu6AtAjlQ/exec";
const GOOGLE_CLIENT_ID = '426523025549-7c50rkn7cun4vmm2r802u0ij6egjehtg.apps.googleusercontent.com';
const PRINCIPAL_ADMIN = '0556798858b@gmail.com';

let me = null;
let activeCat = 'general';

/* פונקציית API מקורית לחלוטין */
async function api(action, params, method = 'GET') {
  document.getElementById('prog').style.transform = 'scaleX(0.5)';
  try {
    let url = BACKEND + '?action=' + encodeURIComponent(action);
    if (method === 'GET' && params) {
        const qs = new URLSearchParams(params);
        url += '&' + qs.toString();
    }
    const options = {
      method: method,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    };
    if (method === 'POST') options.body = JSON.stringify({ ...params, email: me.email });

    const r = await fetch(url, options);
    const json = await r.json();
    document.getElementById('prog').style.transform = 'scaleX(1)';
    setTimeout(()=> document.getElementById('prog').style.transform = 'scaleX(0)', 200);
    return json;
  } catch (e) { 
    document.getElementById('prog').style.transform = 'scaleX(0)';
    return { status: 'error' }; 
  }
}

/* --- AUTH --- */
function initGoogle() {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogle });
  const saved = localStorage.getItem('bina_user');
  if (saved) { me = JSON.parse(saved); onLogin(); }
  else { google.accounts.id.renderButton(document.getElementById('googleBtn'), { theme: 'outline', size: 'large' }); }
}

function handleGoogle(resp) {
  const p = JSON.parse(atob(resp.credential.split('.')[1]));
  me = { email: p.email.toLowerCase(), name: p.name, picture: p.picture };
  localStorage.setItem('bina_user', JSON.stringify(me));
  onLogin();
}

async function onLogin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('userAvatar').innerHTML = `<img src="${me.picture}" style="width:34px;height:34px;border-radius:50%;border:2px solid #1a56db;">`;
  
  // בדיקת הרשאות (מנהל ראשי או מנהל בשיטס)
  const auth = await api('auth_check', { email: me.email });
  const isPrincipal = (me.email === PRINCIPAL_ADMIN.toLowerCase());
  
  if (isPrincipal || auth.admin || auth.writer) {
    document.getElementById('adminComposeBar').style.display = 'flex';
    document.getElementById('writerBadge').innerText = `כותב בתור: ${me.name}`;
    if (isPrincipal || auth.admin) document.getElementById('adminOpener')?.style.setProperty('display', 'block', 'important');
  }
  
  loadFeed();
}

/* --- FEED & RENDERING (SPEED OPTIMIZED) --- */
async function loadFeed() {
  const res = await api('feed', { channel: activeCat });
  if (res.status === 'ok') {
    const inner = document.getElementById('feedInner');
    if (!res.messages || res.messages.length === 0) {
      document.getElementById('empty').style.display = 'block';
      inner.innerHTML = "";
      return;
    }
    document.getElementById('empty').style.display = 'none';
    
    // בניית כל ה-HTML במכה אחת לשיפור מהירות
    const html = res.messages.map(m => `
      <div class="msg-row">
        <img class="msg-av" src="https://cdn-icons-png.flaticon.com/128/6476/6476785.png">
        <div class="msg-col">
          <div class="msg-meta">
            <span class="msg-meta-name">${m.sender || 'מערכת'}</span>
            <span class="msg-meta-time">${new Date(m.ts).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
          </div>
          <div class="bubble">
            <div class="bubble-text">${m.text}</div>
            ${m.imgUrl ? `<div class="bubble-img"><img src="${m.imgUrl}" loading="lazy" onclick="openLB('${m.imgUrl}')"></div>` : ''}
            ${m.videoUrl ? renderVid(m.videoUrl) : ''}
          </div>
        </div>
      </div>
    `).join('');
    
    inner.innerHTML = html;
    document.getElementById('feedWrap').scrollTop = 999999;
  }
}

function renderVid(url) {
  if (url.includes('drive.google.com')) {
    let id = "";
    if (url.includes('id=')) id = url.split('id=')[1].split('&')[0];
    else if (url.includes('/file/d/')) id = url.split('/d/')[1].split('/')[0];
    return `<div class="bubble-vid"><iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay" loading="lazy"></iframe></div>`;
  }
  return `<div class="bubble-vid"><video src="${url}" controls loading="lazy"></video></div>`;
}

/* --- ACTIONS --- */
function execCmd(c) { document.execCommand(c, false, null); }
function promptImg() { let u = prompt("קישור לתמונה:"); if(u) window._pImg = u; }
function promptVid() { let u = prompt("קישור וידאו:"); if(u) window._pVid = u; }

async function sendPost() {
  const txt = document.getElementById('composeEditor').innerHTML;
  if(!txt && !window._pImg && !window._pVid) return;
  const res = await api('feed_add', { 
    channel: activeCat, text: txt, imgUrl: window._pImg||"", videoUrl: window._pVid||"", sender: me.name 
  }, 'POST');
  if (res.status === 'ok') {
    document.getElementById('composeEditor').innerHTML = "";
    window._pImg = ""; window._pVid = "";
    loadFeed();
  }
}

function openLB(s) { document.getElementById('lbImg').src = s; document.getElementById('lightbox').style.display = 'flex'; }
function switchCat(id) { activeCat = id; loadFeed(); }
function doLogout() { localStorage.removeItem('bina_user'); location.reload(); }

window.addEventListener('load', initGoogle);
</script>
