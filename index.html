<script>
/* --- CONFIG --- */
const BACKEND = "https://script.google.com/macros/s/AKfycbyig5wjhHEFUFrJCdakcxu_-R302GplBuxyJo5jintWf7oEXHa_cK4mRvFivHu6AtAjlQ/exec";
const GOOGLE_CLIENT_ID = '426523025549-7c50rkn7cun4vmm2r802u0ij6egjehtg.apps.googleusercontent.com';
const PRINCIPAL_ADMIN_EMAIL = "0556798858b@gmail.com";

let me = null;
let siteData = {
  title: "מזג האוויר",
  categories: ["כללי", "הודעות אחרונות"],
  users: [] // {email, role, allowedCats: []}
};
let posts = [];
let activeCat = "כללי";
let unreadMap = {};

/* --- AUTH --- */
function initGoogle() {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogle });
  const saved = localStorage.getItem('bina_user');
  if (saved) { me = JSON.parse(saved); applyLogin(); }
  else { google.accounts.id.renderButton(document.getElementById('googleBtn'), { theme: 'outline', size: 'large' }); }
}

async function handleGoogle(resp) {
  const payload = JSON.parse(atob(resp.credential.split('.')[1]));
  me = { email: payload.email, name: payload.name, picture: payload.picture };
  localStorage.setItem('bina_user', JSON.stringify(me));
  applyLogin();
}

function doLogout() {
  localStorage.removeItem('bina_user');
  location.reload();
}

async function applyLogin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  
  // Setup Avatar
  const av = document.getElementById('userAvatar');
  av.innerHTML = `<img src="${me.picture}" style="width:34px;height:34px;border-radius:50%; border:2px solid #1a56db;">`;
  av.onclick = (e) => {
    e.stopPropagation();
    const menu = document.getElementById('userMenu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  };
  
  document.getElementById('userMenuInfo').innerHTML = `<strong>${me.name}</strong><br><small>${me.email}</small>`;

  await refreshSiteData();
  renderCategories();
  renderFeed();
  checkPermissions();
}

/* --- PERMISSIONS --- */
function getMyRole() {
  if (me.email === PRINCIPAL_ADMIN_EMAIL) return "principal";
  const user = siteData.users.find(u => u.email === me.email);
  return user ? user.role : "viewer";
}

function checkPermissions() {
  const role = getMyRole();
  const composeBar = document.getElementById('adminComposeBar');
  const adminBtn = document.getElementById('adminPanelBtn');
  
  if (role === "principal" || role === "admin" || role === "uploader") {
    composeBar.classList.add('show');
    document.getElementById('composerNameBadge').innerText = role === "principal" ? "מנהל ראשי" : (role === "admin" ? "מנהל" : "מעלה תוכן");
    setupComposeCategories(role);
  } else {
    composeBar.classList.remove('show');
  }

  if (role === "principal" || role === "admin") {
    adminBtn.style.display = 'block';
  }
}

function setupComposeCategories(role) {
  const select = document.getElementById('composeCategorySelect');
  select.innerHTML = "";
  let allowed = siteData.categories;
  
  if (role === "uploader") {
    const user = siteData.users.find(u => u.email === me.email);
    allowed = user.allowedCats || [];
  }

  allowed.forEach(cat => {
    select.innerHTML += `<option value="${cat}">${cat}</option>`;
  });
}

/* --- DATA & API --- */
async function api(action, params = {}) {
  document.getElementById('prog').style.transform = 'scaleX(0.5)';
  try {
    const resp = await fetch(BACKEND, {
      method: 'POST',
      body: JSON.stringify({ action, ...params, user: me.email })
    });
    const json = await resp.json();
    document.getElementById('prog').style.transform = 'scaleX(1)';
    setTimeout(() => document.getElementById('prog').style.transform = 'scaleX(0)', 500);
    return json;
  } catch (e) {
    console.error(e);
    return { status: "error" };
  }
}

async function refreshSiteData() {
  const res = await api("get_site_data");
  if (res.status === "ok") {
    siteData = res.data;
    document.getElementById('hdrChannelName').innerText = siteData.title;
    document.getElementById('pageTitle').innerText = siteData.title;
    document.getElementById('loginSiteTitle').innerText = siteData.title;
  }
  const postsRes = await api("get_posts");
  posts = postsRes.posts || [];
}

/* --- UI RENDERING --- */
function renderCategories() {
  const list = document.getElementById('channelsList');
  list.innerHTML = "";
  siteData.categories.forEach(cat => {
    const isActive = activeCat === cat ? "active" : "";
    const isUnread = unreadMap[cat] ? "has-unread" : "";
    list.innerHTML += `
      <div class="channel-item ${isActive} ${isUnread}" onclick="setActiveCat('${cat}')">
        <i class="fas fa-hashtag"></i>
        ${cat}
        <div class="unread-badge-cat"></div>
      </div>`;
  });
}

function setActiveCat(cat) {
  activeCat = cat;
  unreadMap[cat] = false;
  renderCategories();
  renderFeed();
  if (window.innerWidth < 900) document.getElementById('leftSidebar').classList.remove('open');
}

function renderFeed() {
  const inner = document.getElementById('feedInner');
  const filtered = posts.filter(p => p.category === activeCat);
  inner.innerHTML = "";
  
  if (filtered.length === 0) {
    document.getElementById('empty').style.display = 'block';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  filtered.forEach(p => {
    inner.innerHTML += `
      <div class="msg-row" data-id="${p.id}">
        <img class="msg-av" src="https://cdn-icons-png.flaticon.com/128/6476/6476785.png">
        <div class="msg-col">
          <div class="msg-meta">
            <span class="msg-meta-name">${p.senderName}</span>
            <span class="msg-meta-time">${new Date(p.ts).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
          </div>
          <div class="bubble-wrap-outer">
             ${(getMyRole() === 'admin' || getMyRole() === 'principal') ? `
             <div class="bubble-top-actions">
                <button onclick="deletePost('${p.id}')"><i class="fas fa-trash"></i></button>
             </div>` : ''}
             <div class="bubble">
                ${p.text ? `<div class="bubble-text">${p.text}</div>` : ''}
                ${p.img ? `<div class="bubble-img"><img src="${p.img}" onclick="openLightbox('${p.img}')"></div>` : ''}
                ${p.video ? renderVideo(p.video) : ''}
             </div>
          </div>
        </div>
      </div>`;
  });
}

function renderVideo(url) {
  let videoHtml = "";
  if (url.includes('drive.google.com')) {
    // הפיכת קישור דרייב לקישור הטמעה
    let driveId = "";
    if (url.includes('id=')) driveId = url.split('id=')[1].split('&')[0];
    else driveId = url.split('/d/')[1].split('/')[0];
    const embedUrl = `https://drive.google.com/file/d/${driveId}/preview`;
    videoHtml = `<div class="bubble-vid"><iframe src="${embedUrl}" allow="autoplay"></iframe></div>`;
  } else {
    videoHtml = `<div class="bubble-vid"><video src="${url}" controls></video></div>`;
  }
  return videoHtml;
}

/* --- ACTIONS --- */
async function sendPost() {
  const ed = document.getElementById('composeEditor');
  const text = ed.innerText.trim();
  const cat = document.getElementById('composeCategorySelect').value;
  const img = window._pendingImg || "";
  const video = window._pendingVid || "";

  if (!text && !img && !video) return;

  const res = await api("add_post", {
    text, category: cat, img, video, senderName: me.name
  });

  if (res.status === "ok") {
    ed.innerText = "";
    window._pendingImg = "";
    window._pendingVid = "";
    await refreshSiteData();
    renderFeed();
  }
}

function openVideoPrompt() {
  const url = prompt("הדבק קישור לסרטון (Google Drive או ישיר):");
  if (url) {
    window._pendingVid = url;
    alert("סרטון צורף להודעה");
  }
}

function triggerImgUpload() {
  const url = prompt("הדבק קישור לתמונה:");
  if (url) {
    window._pendingImg = url;
    alert("תמונה צורפה");
  }
}

async function deletePost(id) {
  if (!confirm("למחוק פוסט זה?")) return;
  const res = await api("delete_post", { id });
  if (res.status === "ok") {
    await refreshSiteData();
    renderFeed();
  }
}

function openMail() {
  window.location.href = "mailto:0556798858b@gmail.com";
}

/* --- ADMIN PANEL FUNCTIONS --- */
function openAdminModal() {
  const role = getMyRole();
  const modal = document.getElementById('adminModal');
  modal.style.display = 'flex';
  
  if (role === "principal") {
    document.getElementById('principalAdminSection').style.display = 'block';
    document.getElementById('siteTitleInp').value = siteData.title;
    renderUserList();
  }
  
  if (role === "principal" || role === "admin") {
    document.getElementById('adminSection').style.display = 'block';
    renderCategoryMgmt();
  }

  // Uploader Role logic
  document.getElementById('newUserRole').onchange = (e) => {
    const box = document.getElementById('uploaderPermsBox');
    if (e.target.value === 'uploader') {
       box.style.display = 'block';
       const list = document.getElementById('catPermList');
       list.innerHTML = siteData.categories.map(c => `
         <label style="font-size:12px;"><input type="checkbox" value="${c}" class="cat-perm-chk"> ${c}</label>
       `).join('');
    } else {
       box.style.display = 'none';
    }
  };
}

async function updateSiteSettings() {
  const title = document.getElementById('siteTitleInp').value;
  await api("update_site_title", { title });
  location.reload();
}

async function addNewUser() {
  const email = document.getElementById('newUserEmail').value.trim();
  const role = document.getElementById('newUserRole').value;
  let allowed = [];
  if (role === 'uploader') {
    document.querySelectorAll('.cat-perm-chk:checked').forEach(chk => allowed.push(chk.value));
  }
  
  await api("manage_user", { action: "add", email, role, allowedCats: allowed });
  await refreshSiteData();
  renderUserList();
}

function renderUserList() {
  const list = document.getElementById('userList');
  list.innerHTML = siteData.users.map(u => `
    <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #eee; font-size:12px;">
      <span>${u.email} (${u.role})</span>
      <button onclick="removeUser('${u.email}')" style="color:red; border:none; background:none; cursor:pointer;">מחק</button>
    </div>
  `).join('');
}

async function removeUser(email) {
  await api("manage_user", { action: "remove", email });
  await refreshSiteData();
  renderUserList();
}

async function addCategory() {
  const name = document.getElementById('newCatInp').value.trim();
  if (!name) return;
  await api("manage_category", { action: "add", name });
  document.getElementById('newCatInp').value = "";
  await refreshSiteData();
  renderCategoryMgmt();
  renderCategories();
}

function renderCategoryMgmt() {
  const list = document.getElementById('categoryMgmtList');
  list.innerHTML = siteData.categories.map(c => `
    <div style="display:flex; justify-content:space-between; padding:8px; background:#f9f9f9; border-radius:8px; margin-bottom:5px;">
      <span>${c}</span>
      <button onclick="deleteCategory('${c}')" style="color:red; border:none; background:none; cursor:pointer;"><i class="fas fa-trash"></i></button>
    </div>
  `).join('');
}

async function deleteCategory(name) {
  if (!confirm("למחוק קטגוריה זו? כל הפוסטים בה יימחקו.")) return;
  await api("manage_category", { action: "remove", name });
  await refreshSiteData();
  renderCategoryMgmt();
  renderCategories();
}

/* --- HELPERS --- */
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('shaagat_dark', document.body.classList.contains('dark') ? '1' : '0');
}

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lbImg').src = src;
  lb.style.display = 'flex';
}

window.onclick = function(event) {
  if (!event.target.closest('#userAvatar')) {
    document.getElementById('userMenu').style.display = 'none';
  }
};

// Start
window.addEventListener('load', () => {
  initGoogle();
  if (localStorage.getItem('shaagat_dark') === '1') document.body.classList.add('dark');
});
