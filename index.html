<script>
const BACKEND = "https://script.google.com/macros/s/AKfycbyig5wjhHEFUFrJCdakcxu_-R302GplBuxyJo5jintWf7oEXHa_cK4mRvFivHu6AtAjlQ/exec";
const GOOGLE_CLIENT_ID = '426523025549-7c50rkn7cun4vmm2r802u0ij6egjehtg.apps.googleusercontent.com';

let me = null, items = [], lastTs = 0;

/* --- API --- */
async function api(action, params, method = 'GET') {
  const url = BACKEND + '?action=' + encodeURIComponent(action);
  const options = {
    method: method === 'GET' ? 'GET' : 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  };
  if (method === 'POST') options.body = JSON.stringify({ ...params, email: me?.email });
  if (method === 'GET' && params) {
    const qs = new URLSearchParams(params);
    return fetch(url + '&' + qs.toString()).then(r => r.json());
  }
  return fetch(url, options).then(r => r.json());
}

/* --- AUTH --- */
function initGoogle() {
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogle });
  const saved = localStorage.getItem('bina_user');
  if (saved) { me = JSON.parse(saved); onLogin(); }
  else { google.accounts.id.renderButton(document.getElementById('googleBtn'), { theme: 'outline', size: 'large' }); }
}

function handleGoogle(resp) {
  const p = JSON.parse(atob(resp.credential.split('.')[1]));
  me = { email: p.email.toLowerCase(), name: p.name, picture: p.picture };
  localStorage.setItem('bina_user', JSON.stringify(me));
  onLogin();
}

async function onLogin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('userAvatar').innerHTML = `<img src="${me.picture}" style="width:34px;height:34px;border-radius:50%;border:2px solid #1a56db;">`;
  
  const auth = await api('auth_check', { email: me.email });
  if (auth.admin || auth.writer) {
    document.getElementById('adminComposeBar').classList.add('show');
    document.getElementById('writerBadge').innerText = `כותב בתור: ${me.name}`;
  }
  loadFeed();
}

/* --- FEED --- */
async function loadFeed() {
  const res = await api('feed', { channel: 'general' });
  if (res.status === 'ok') {
    items = res.messages;
    renderFeed();
  }
}

function renderFeed() {
  const inner = document.getElementById('feedInner');
  inner.innerHTML = items.map(m => `
    <div class="msg-row" data-id="${m.id}">
      <img class="msg-av" src="https://cdn-icons-png.flaticon.com/128/6476/6476785.png">
      <div class="msg-col">
        <div class="msg-meta"><span class="msg-meta-name">${m.sender || 'מערכת'}</span> <span class="msg-meta-time">${new Date(m.ts).toLocaleTimeString('he-IL')}</span></div>
        <div class="bubble">
          <div class="bubble-text">${m.text}</div>
          ${m.imgUrl ? `<div class="bubble-img"><img src="${m.imgUrl}" loading="lazy" onclick="openLB('${m.imgUrl}')"></div>` : ''}
          ${m.videoUrl ? renderVid(m.videoUrl) : ''}
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById('feedWrap').scrollTop = 999999;
}

function renderVid(url) {
  if (url.includes('drive.google.com')) {
    let id = url.includes('id=') ? url.split('id=')[1].split('&')[0] : url.split('/d/')[1].split('/')[0];
    return `<iframe src="https://drive.google.com/file/d/${id}/preview" style="width:100%;height:300px;border:none;margin-top:10px;border-radius:12px;"></iframe>`;
  }
  return `<video src="${url}" controls style="width:100%;margin-top:10px;border-radius:12px;"></video>`;
}

/* --- ACTIONS --- */
function execCmd(c) { document.execCommand(c, false, null); }
function promptImg() { let u = prompt("קישור לתמונה:"); if(u) window._pImg = u; }
function promptVid() { let u = prompt("קישור וידאו:"); if(u) window._pVid = u; }

async function sendPost() {
  const txt = document.getElementById('composeEditor').innerHTML;
  if (!txt && !window._pImg) return;
  const res = await api('feed_add', { 
    channel: 'general', text: txt, imgUrl: window._pImg||"", videoUrl: window._pVid||"", sender: me.name 
  }, 'POST');
  if (res.status === 'ok') {
    document.getElementById('composeEditor').innerHTML = "";
    window._pImg = ""; window._pVid = "";
    loadFeed();
  }
}

function openLB(s) { document.getElementById('lbImg').src = s; document.getElementById('lightbox').classList.add('show'); }
function toggleDark() { document.body.classList.toggle('dark'); }
function doLogout() { localStorage.removeItem('bina_user'); location.reload(); }
function scrollToBottom() { document.getElementById('feedWrap').scrollTo({ top: 999999, behavior: 'smooth' }); }

window.addEventListener('load', initGoogle);
</script>
</body>
